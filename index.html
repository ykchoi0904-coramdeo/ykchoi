<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Coram Deo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;600&display=swap">
<style>
/* 레이아웃: 햇살 드는 서재. 왼쪽 큰 세리프 제목 + 오른쪽 영상 카드(55:45), 아래로 넉넉한 여백의 단일 열 흐름. 단일(라이트) 테마로 의도적으로 고정. */
:root{
  --ivory:#f7f1e3; --paper:#fffaf0; --sun:#f3dfae; --charcoal:#2b2a27; --ink-soft:#56524a;
  --green:#234a3a; --green-deep:#18362a; --gold:#a8843c; --gold-soft:#d9c28c; --line:#e2d6bb;
  --display:"Cormorant Garamond","Times New Roman",serif;
  --serif-kr:"Noto Serif KR","Nanum Myeongjo",serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --r:14px; --shadow:0 10px 30px rgba(74,58,22,.12);
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--ivory);color:var(--charcoal);font-family:var(--body);font-size:18px;line-height:1.8;word-break:keep-all;overflow-wrap:anywhere}
h1,h2,h3{text-wrap:balance;line-height:1.35;margin:0}
p{margin:0}
a{color:var(--green)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:6px}
.wrap{max-width:1180px;margin-inline:auto;padding-inline:20px}
.skip{position:absolute;left:-999px}
.skip:focus{left:16px;top:16px;z-index:50;background:var(--green);color:var(--paper);padding:10px 16px;border-radius:8px}

/* 상단 메뉴 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(247,241,227,.96);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:68px;flex-wrap:wrap}
.logo{font-family:var(--display);font-size:1.75rem;font-weight:600;letter-spacing:.01em;color:var(--green-deep);background:none;border:0;padding:6px 4px;text-decoration:none}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav a{display:block;padding:10px 14px;min-height:44px;border-radius:8px;text-decoration:none;color:var(--charcoal);font-weight:500;font-size:1.02rem;border-bottom:3px solid transparent;transition:background .2s}
.nav a:hover{background:#efe5cc}
.nav a[aria-current="page"]{color:var(--green-deep);font-weight:700;border-bottom-color:var(--gold);background:#efe5cc}
.menu-btn{display:none;min-height:48px;padding:8px 16px;border:1.5px solid var(--green);border-radius:10px;background:var(--paper);color:var(--green-deep);font-weight:700}
@media(max-width:940px){
  .menu-btn{display:block}
  .nav{display:none;flex-direction:column;width:100%;padding-bottom:12px}
  .nav.open{display:flex}
  .nav a{padding:13px 14px;font-size:1.1rem;border-bottom:0;border-left:4px solid transparent}
  .nav a[aria-current="page"]{border-left-color:var(--gold)}
}

/* 첫 화면 */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line);
  background:
   radial-gradient(60rem 30rem at 8% -10%,rgba(255,236,170,.75),transparent 65%),
   linear-gradient(115deg,transparent 0 38%,rgba(255,244,205,.55) 38% 46%,transparent 46% 52%,rgba(255,244,205,.4) 52% 58%,transparent 58%),
   repeating-linear-gradient(0deg,rgba(120,96,48,.035) 0 1px,transparent 1px 34px),
   var(--ivory)}
.hero .wrap{display:grid;grid-template-columns:55fr 45fr;gap:48px;align-items:center;padding-block:56px 64px}
.hero>.wrap>*{min-width:0}
.hero h1{font-family:var(--display);font-weight:500;font-size:clamp(3.6rem,9vw,7rem);line-height:1;color:var(--green-deep);letter-spacing:-.01em}
.hero h1 em{font-style:italic;color:var(--gold)}
.rule{width:72px;height:2px;background:var(--gold);margin:26px 0 22px}
.tagline{font-family:var(--serif-kr);font-size:clamp(1.3rem,2.6vw,1.75rem);font-weight:600;color:var(--charcoal)}
.intro{margin-top:14px;color:var(--ink-soft);font-size:1.1rem;max-width:30em}
.btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:12px 26px;border-radius:10px;border:2px solid var(--green);background:var(--green);color:#fffaf0;font-weight:700;font-size:1.05rem;text-decoration:none;transition:background .2s}
.btn:hover{background:var(--green-deep)}
.btn.ghost{background:transparent;color:var(--green-deep)}
.btn.ghost:hover{background:#e9dfc4}
.btn[disabled],.btn[aria-disabled="true"]{background:#e6dcc4;border-color:#d3c7a8;color:#6b6558;cursor:not-allowed}
@media(max-width:900px){.hero .wrap{grid-template-columns:1fr;gap:34px;padding-block:40px 48px}}

/* 영상 카드 */
.vcard{background:var(--paper);border:1px solid var(--gold-soft);border-radius:18px;box-shadow:var(--shadow);padding:20px}
.vcard h2{font-family:var(--serif-kr);font-size:1.3rem;color:var(--green-deep);margin-bottom:14px;display:flex;align-items:center;gap:10px}
.vcard h2::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold)}
.screen{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:12px;overflow:hidden;border:1px solid var(--line);
  background:radial-gradient(circle at 30% 20%,#35604d,var(--green-deep) 70%);display:grid;place-items:center;text-align:center;color:#f3ead2;padding:16px}
.screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.screen .ring{width:72px;height:72px;border-radius:50%;border:2px solid var(--gold-soft);display:grid;place-items:center;margin:0 auto 12px}
.screen .ring::after{content:"";border-left:22px solid var(--gold-soft);border-top:13px solid transparent;border-bottom:13px solid transparent;margin-left:6px}
.screen p{font-size:1.02rem}
.screen .play{background:none;border:0;color:inherit;text-decoration:none;display:block;padding:10px;border-radius:12px}
.screen .play:hover .ring{background:rgba(217,194,140,.18)}
.vmeta{margin-top:16px;display:grid;gap:4px}
.vmeta strong{font-size:1.2rem}
.vmeta span{color:var(--ink-soft);font-size:1rem}
.more{display:inline-block;margin-top:14px;font-weight:700;padding:8px 0;min-height:44px}

/* 구획 */
section.block{padding-block:64px}
section.block+section.block{border-top:1px solid var(--line)}
.h-sec{font-family:var(--serif-kr);font-size:clamp(1.6rem,3.4vw,2.1rem);font-weight:600;color:var(--green-deep);margin-bottom:8px}
.sub{color:var(--ink-soft);margin-bottom:30px}
.tag{display:inline-block;font-size:.85rem;font-weight:700;padding:2px 10px;border-radius:999px;border:1px solid var(--gold);color:#7a5d1f;background:#fbf1d6;line-height:1.6;white-space:nowrap}
.tag.cat{border-color:#b9cdbf;color:var(--green-deep);background:#e8f0e6}
.tag.plain{border-color:var(--line);color:var(--ink-soft);background:transparent}

/* 주요 메뉴 카드 */
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:18px}
.card{display:flex;flex-direction:column;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:24px 20px;text-decoration:none;color:var(--charcoal);min-width:0;transition:transform .2s,box-shadow .2s,border-color .2s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--gold-soft)}
.card svg{width:44px;height:44px;stroke:var(--green);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.card h3{font-size:1.3rem;color:var(--green-deep)}
.card p{font-size:1rem;color:var(--ink-soft);line-height:1.7;flex:1}
.card .go{font-weight:700;color:var(--green);border-top:1px solid var(--line);padding-top:12px}
.card .go::after{content:" →"}
@media(max-width:1100px){.cards{grid-template-columns:repeat(6,1fr)}.card{grid-column:span 2}.card:nth-child(n+4){grid-column:span 3}}
@media(max-width:720px){.cards{grid-template-columns:1fr 1fr}.card,.card:nth-child(n+4){grid-column:auto}.card:last-child{grid-column:1/-1}}
@media(max-width:480px){.cards{grid-template-columns:1fr}}

/* 목록 */
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.list li{border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:1fr auto;gap:6px 20px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:18px 8px;min-height:56px;transition:background .2s}
.row:hover{background:#f1e8d0}
.row>*{min-width:0}
.row h3{font-size:1.15rem;font-weight:700}
.row p{color:var(--ink-soft);font-size:1rem}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--ink-soft);font-size:.95rem;font-variant-numeric:tabular-nums}
@media(max-width:640px){.row{grid-template-columns:1fr}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:56px}
.two>*{min-width:0}
@media(max-width:900px){.two{grid-template-columns:1fr;gap:48px}}
.story{padding:20px 0;border-bottom:1px solid var(--line)}
.story:first-of-type{border-top:1px solid var(--line)}
.story h3{font-family:var(--serif-kr);font-size:1.2rem;margin:6px 0}
.story p{color:var(--ink-soft)}

/* 내부 화면 */
.page-head{padding-block:44px 28px;background:linear-gradient(180deg,#f3e6c2,var(--ivory));border-bottom:1px solid var(--line)}
.page-head h1{font-family:var(--serif-kr);font-size:clamp(1.9rem,4vw,2.5rem);color:var(--green-deep)}
.page-head p{color:var(--ink-soft);margin-top:8px;max-width:38em}
.tools{display:grid;gap:16px;margin-bottom:24px}
.search{display:grid;gap:6px;max-width:520px}
.search label{font-weight:700;font-size:1rem}
.search input{font:inherit;min-height:52px;padding:10px 16px;border:1.5px solid #bfb394;border-radius:10px;background:var(--paper);color:var(--charcoal);width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:46px;padding:8px 18px;border-radius:999px;border:1.5px solid #bfb394;background:var(--paper);font-weight:500}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fffaf0;font-weight:700}
.empty{padding:36px 16px;text-align:center;color:var(--ink-soft);border:1px dashed #bfb394;border-radius:var(--r)}
.note{background:#fbf1d6;border:1px solid var(--gold-soft);border-radius:10px;padding:12px 16px;font-size:.98rem;color:#5d4a1c;margin-bottom:24px}
.back{background:none;border:0;color:var(--green);font-weight:700;padding:10px 0;min-height:44px;margin-bottom:10px}
.detail{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:clamp(20px,4vw,40px);max-width:820px}
.detail h2{font-family:var(--serif-kr);font-size:1.7rem;color:var(--green-deep);margin:10px 0 14px}
.detail h3{font-size:1.15rem;color:var(--green-deep);margin:26px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.detail .body{max-width:34em;white-space:pre-line}
.detail ol{margin:0;padding-left:1.4em}

/* 서재 */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:36px 28px;padding:28px 24px 0;border-bottom:10px solid #c9b383;border-radius:0 0 4px 4px;background:linear-gradient(180deg,transparent 60%,rgba(168,132,60,.12))}
.book{background:none;border:0;padding:0 0 20px;text-align:left;display:grid;gap:10px}
.cover{aspect-ratio:2/3;max-width:100%;border-radius:3px 8px 8px 3px;box-shadow:6px 8px 18px rgba(60,45,15,.28);display:flex;flex-direction:column;justify-content:space-between;padding:18px 16px;color:#f6edd3;border-left:7px solid rgba(0,0,0,.22);transition:transform .2s;overflow:hidden;background:var(--green)}
.book:hover .cover{transform:translateY(-6px)}
.cover.c1{background:#5a3b2a}.cover.c2{background:#2e3f57}
.cover img{width:100%;height:100%;object-fit:cover}
.cover b{font-family:var(--serif-kr);font-size:1.2rem;line-height:1.4}
.cover i{font-family:var(--display);font-size:1rem;color:var(--gold-soft)}
.book span{font-weight:700}
.bookview{display:grid;grid-template-columns:240px 1fr;gap:36px;align-items:start}
.bookview>*{min-width:0}
@media(max-width:720px){.bookview{grid-template-columns:1fr}.bookview .cover{max-width:220px}}

/* 갤러리 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.photo{border:0;padding:0;background:none;text-align:left;display:grid;gap:8px}
.ph{aspect-ratio:4/3;max-width:100%;border-radius:10px;overflow:hidden;border:1px solid var(--line);display:grid;place-items:center;color:#5c5645;font-size:.95rem;text-align:center;padding:10px;
  background:linear-gradient(135deg,#eadfbf,#d6dfcd)}
.ph.t1{background:linear-gradient(135deg,#dfe6d6,#efe2bd)}.ph.t2{background:linear-gradient(135deg,#f0dcb4,#e6d9c8)}.ph.t3{background:linear-gradient(135deg,#d5ddd0,#e9e3cf)}
.ph img{width:100%;height:100%;object-fit:cover}
.photo:hover .ph{box-shadow:var(--shadow)}
.photo b{font-weight:500}
dialog{border:0;border-radius:16px;padding:0;background:var(--paper);color:var(--charcoal);width:min(880px,calc(100vw - 32px));box-shadow:0 30px 80px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(30,28,22,.72)}
dialog .ph{border-radius:0;border:0;aspect-ratio:3/2;font-size:1.1rem}
dialog .cap{padding:20px 24px 24px;display:grid;gap:8px}
dialog .cap h2{font-family:var(--serif-kr);font-size:1.35rem}
dialog .x{justify-self:end}

.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px}
.vgrid .vcard{box-shadow:none}

footer{background:var(--green-deep);color:#e9dfc4;padding-block:44px;margin-top:20px}
footer .f-logo{font-family:var(--display);font-size:2rem;color:#fffaf0}
footer .f-tag{font-family:var(--serif-kr);color:var(--gold-soft);margin-bottom:18px}
footer small{font-size:.92rem;display:block;color:#cdc3a6;line-height:1.7}
footer dl{display:flex;flex-wrap:wrap;gap:4px 24px;margin:0 0 16px;font-size:.98rem}
footer dt{display:inline;font-weight:700}footer dd{display:inline;margin:0 0 0 6px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

</head>
<body>
<a class="skip" href="#app">본문으로 바로가기</a>
<header class="top">
  <div class="wrap">
    <a class="logo" href="#home" aria-label="Coram Deo 홈">Coram Deo</a>
    <button class="menu-btn" id="menuBtn" type="button" aria-expanded="false" aria-controls="nav">메뉴</button>
    <nav class="nav" id="nav" aria-label="주요 메뉴"></nav>
  </div>
</header>
<main id="app" tabindex="-1"></main>
<footer><div class="wrap" id="foot"></div></footer>
<dialog id="lightbox" aria-labelledby="lbTitle"></dialog>

<script>

const ICONS = {
  bible:'<path d="M10 8h18a4 4 0 0 1 4 4v26H14a4 4 0 0 1-4-4z"/><path d="M21 14v10M17 18h8"/><path d="M38 10l4 4-12 22-5 2 1-6z"/>',
  book:'<path d="M24 12c-4-3-10-4-16-3v26c6-1 12 0 16 3 4-3 10-4 16-3V9c-6-1-12 0-16 3z"/><path d="M24 12v26"/>',
  folder:'<path d="M6 14a3 3 0 0 1 3-3h9l4 5h17a3 3 0 0 1 3 3v17a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3z"/><path d="M15 26h18M15 32h11"/>',

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https?:\/\//i.test(u || "") ? u : "";
const ytId = u => { const m = String(u||"").match(/(?:youtu\.be\/|v=|embed\/|shorts\/|live\/)([\w-]{11})/); return m ? m[1] : ""; };
const sampleTag = x => x.sample ? '<span class="tag">샘플</span>' : "";
const $ = s => document.querySelector(s);
const app = $("#app");
const state = { q:"", cat:"전체", detail:null };
const allCards = () => [["sermon",CONTENT.sections.sermon],["class",CONTENT.sections.class],["library",CONTENT.sections.library],["study",CONTENT.study],["gallery",CONTENT.gallery]];

function videoBox(v, label){
  const id = ytId(v.youtube);
  if(!id) return `<div class="screen" role="img" aria-label="설교 영상 자리표시자"><div><div class="ring" aria-hidden="true"></div><p>설교 영상이 등록될 공간입니다</p></div></div>`;
  const t = esc(v.title || label || "설교 영상");
  if(CONTENT.site.inlinePlayer) return `<div class="screen"><button class="play" type="button" data-play="${id}" aria-label="${t} 재생"><div class="ring" aria-hidden="true"></div><p>재생하기</p></button></div>`;
  return `<div class="screen"><a class="play" href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener" aria-label="${t} 유튜브에서 재생 (새 창)"><div class="ring" aria-hidden="true"></div><p>유튜브에서 재생하기</p></a></div>`;
}
function videoMeta(v){
  return `<div class="vmeta"><strong>${esc(v.title || "설교 제목 (등록 예정)")} ${sampleTag(v)}</strong>
    <span>본문: ${esc(v.passage || "등록 예정")}</span><span>날짜: ${esc(v.date || "등록 예정")}</span></div>`;
}
function recentItems(){
  return Object.entries(CONTENT.sections).flatMap(([k,s]) => s.items.map((it,i)=>({...it,sec:k,secTitle:s.title,idx:i})))
    .sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,5);
}
function itemRow(it, sec, idx, showSec){
  return `<li><button class="row" type="button" data-open="${sec}:${idx}">
    <div><h3>${esc(it.title)} ${sampleTag(it)}</h3><p>${esc(it.summary)}</p></div>
    <div class="meta">${showSec?`<span class="tag plain">${esc(showSec)}</span>`:""}<span class="tag cat">${esc(it.category)}</span><span>${esc(it.date)}</span><span class="tag plain">${esc(it.type)}</span></div>
  </button></li>`;
}

    <div><h2 class="h-sec">함께 걷는 이야기</h2><p class="sub">목회자의 짧은 글과 공동체 소식입니다.</p>

function pageHead(title, desc){ return `<div class="page-head"><div class="wrap"><h1>${esc(title)}</h1><p>${esc(desc)}</p></div></div>`; }
function hasSample(arr){ return arr.some(x=>x.sample) ? '<p class="note">「샘플」 표시가 붙은 항목은 화면 구성을 보여 주는 예시이며, 실제 자료가 아닙니다.</p>' : ""; }
function chips(cats){ return `<div class="chips" role="group" aria-label="분류">${["전체",...cats].map(c=>`<button class="chip" type="button" data-cat="${esc(c)}" aria-pressed="${state.cat===c}">${esc(c)}</button>`).join("")}</div>`; }

function viewSection(key){
  const sec = CONTENT.sections[key];
  if(state.detail !== null && sec.items[state.detail]){
    const it = sec.items[state.detail], file = safeUrl(it.file);
    return pageHead(sec.title, sec.desc) + `<section class="block"><div class="wrap">
      <button class="back" type="button" data-back>← 목록으로</button>
      <article class="detail">
        <div class="meta">${sampleTag(it)}<span class="tag cat">${esc(it.category)}</span><span>등록일 ${esc(it.date)}</span><span class="tag plain">${esc(it.type)}</span></div>
        <h2>${esc(it.title)}</h2><p>${esc(it.summary)}</p>
        <h3>자료 내용</h3><p class="body">${esc(it.body || "등록된 내용이 없습니다.")}</p>
        <h3>첨부파일</h3>
        ${file ? `<a class="btn" href="${esc(file)}" target="_blank" rel="noopener">첨부파일 내려받기</a>`
               : `<button class="btn" type="button" disabled>첨부파일 없음</button><p class="meta" style="margin-top:8px">아직 등록된 첨부파일이 없습니다.</p>`}
      </article></div></section>`;
  }
  return pageHead(sec.title, sec.desc) + `<section class="block"><div class="wrap">
    ${hasSample(sec.items)}
    <div class="tools">
      <div class="search"><label for="q-${key}">자료 검색</label><input id="q-${key}" type="search" placeholder="제목이나 설명으로 찾기" value="${esc(state.q)}" autocomplete="off"></div>
      ${chips(sec.categories)}
    </div>
    <div id="results" aria-live="polite">${listHtml(key)}</div>
  </div></section>`;
}
function listHtml(key){
  const sec = CONTENT.sections[key], q = state.q.trim().toLowerCase();
  const rows = sec.items.map((it,i)=>[it,i]).filter(([it])=>(state.cat==="전체"||it.category===state.cat) && (!q || (it.title+" "+it.summary+" "+it.category).toLowerCase().includes(q)));
  return rows.length ? `<p class="meta" style="margin-bottom:10px">자료 ${rows.length}건</p><ul class="list">${rows.map(([it,i])=>itemRow(it,key,i)).join("")}</ul>`
                     : `<p class="empty">조건에 맞는 자료가 없습니다. 검색어나 분류를 바꿔 보세요.</p>`;
}

function coverHtml(b,i){
  const src = safeUrl(b.cover);
  return src ? `<div class="cover" style="padding:0;border-left:0"><img src="${esc(src)}" alt="${esc(b.title)} 표지"></div>`
             : `<div class="cover c${i%3}" role="img" aria-label="${esc(b.title)} 표지 자리"><b>${esc(b.title)}</b><i>Coram Deo</i></div>`;
}

function route(){ const h = location.hash.slice(1); return ["home","sermon","class","library","study","gallery","sermons"].includes(h) ? h : "home"; }
function render(focus){

  $("#nav").innerHTML = MENU.map(([k,t])=>`<a href="#${k}"${k===r?' aria-current="page"':""}>${t}</a>`).join("");
  if(focus){ window.scrollTo(0,0); app.focus({preventScroll:true}); }
}

function closeMenu(){ $("#nav").classList.remove("open"); $("#menuBtn").setAttribute("aria-expanded","false"); }
$("#menuBtn").addEventListener("click", ()=>{ const o = $("#nav").classList.toggle("open"); $("#menuBtn").setAttribute("aria-expanded", o); });

app.addEventListener("click", e=>{
  const t = e.target.closest("[data-scroll],[data-open],[data-cat],[data-back],[data-book],[data-photo],[data-play]");
  if(!t) return;
  if(t.dataset.scroll){ const el = document.getElementById(t.dataset.scroll); el.scrollIntoView({block:"start"}); el.focus({preventScroll:true}); }
  else if(t.dataset.open){ const [sec,i] = t.dataset.open.split(":"); state.detail = +i; state.q=""; state.cat="전체";
    if(route()!==sec){ const d = +i; history.pushState(null,"","#"+sec); state.detail = d; } render(true); }
  else if(t.dataset.cat){ state.cat = t.dataset.cat; render(false); const b=[...app.querySelectorAll("[data-cat]")].find(x=>x.dataset.cat===state.cat); b && b.focus(); }
  else if("back" in t.dataset){ state.detail = null; render(true); }
  else if(t.dataset.book){ state.detail = +t.dataset.book; render(true); }
  else if(t.dataset.photo){ openPhoto(+t.dataset.photo); }
  else if(t.dataset.play){ t.parentElement.innerHTML = `<iframe src="https://www.youtube.com/embed/${t.dataset.play}?autoplay=1" title="설교 영상" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`; }
});
app.addEventListener("input", e=>{
  if(e.target.type==="search"){ state.q = e.target.value; $("#results").innerHTML = listHtml(route()); }
});
function openPhoto(i){
  const p = CONTENT.gallery.photos[i], d = $("#lightbox");
  d.innerHTML = `${phHtml(p,i)}<div class="cap"><div class="meta">${sampleTag(p)}<span class="tag cat">${esc(p.category)}</span></div>
    <h2 id="lbTitle">${esc(p.title)}</h2><p>${esc(p.desc)}</p><button class="btn ghost x" type="button" id="lbClose">닫기</button></div>`;
  d.showModal(); $("#lbClose").focus();
}
$("#lightbox").addEventListener("click", e=>{ if(e.target.id==="lbClose" || e.target===e.currentTarget) e.currentTarget.close(); });

renderFooter(); render(false);
</script>
</body>
